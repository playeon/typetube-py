[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "typetube"
version = "1.1.2"
description = "High-performance unthrottled YouTube media stream extraction and download client powered by TAP"
readme = "README.md"
authors = [{ name = "TypeTube" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "cryptography>=41.0.0",
    "zstandard>=0.21.0",
    "brotli>=1.1.0"
]
keywords = ["typetube", "youtube", "stream", "audio", "video", "tap", "hifi", "download", "media"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/playeon/typetube"
Issues = "https://github.com/playeon/typetube/issues"

[project.scripts]
typetube = "typetube.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["typetube*"]
